<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #242424;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    .cue-auth-screen {
      min-height: 100vh;
      width: 100vw;
      background-color: #242424;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cue-auth-box {
      width: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .cue-auth-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 18px;
    }

    .cue-auth-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cue-session-input {
      width: 100%;
      height: 40px;
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 9999px;
      padding: 0 18px;
      font-size: 12px;
      color: #ffffff;
      text-align: center;
      outline: none !important;
      box-shadow: none !important;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }

    .cue-session-input:focus,
    .cue-session-input:focus-visible,
    .cue-session-input:active {
      outline: none !important;
      box-shadow: none !important;
      border-color: #383838 !important;
    }

    .cue-session-input::placeholder {
      color: #555555;
    }

    .cue-continue-btn {
      width: 100%;
      height: 40px;
      background-color: #1c1c1c;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 9999px;
      color: #777777;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease;
      outline: none;
      font-family: inherit;
    }

    .cue-continue-btn:hover:not(:disabled) {
      background-color: #262626;
      color: #ffffff;
    }

    .cue-continue-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cue-error-msg {
      color: #ef4444;
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      line-height: 1.4;
    }

    .cue-status-msg {
      color: #10b981;
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="cue-auth-screen">
    <div class="cue-auth-box">
      <h1 class="cue-auth-title">Log in</h1>

      <form id="authForm" class="cue-auth-form">
        <input
          id="sessionInput"
          type="password"
          class="cue-session-input"
          placeholder="Enter Session Cookie"
          autocomplete="off"
          autofocus
          required
        />

        <button id="continueBtn" type="submit" class="cue-continue-btn">
          Continue
        </button>
      </form>

      <p id="errorMsg" class="cue-error-msg" style="display: none;"></p>
      <p id="statusMsg" class="cue-status-msg" style="display: none;"></p>
    </div>
  </div>

  <script>
    // Browser auto-recognition: if session already exists, redirect straight to dashboard
    (function checkExistingSession() {
      try {
        const savedToken = localStorage.getItem('sotarium_session_token') || localStorage.getItem('sotarium_registered_token');
        if (savedToken && savedToken.length > 10) {
          fetch('/api/verify-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: savedToken })
          }).then(r => r.ok ? r.json() : null).then(data => {
            if (data && data.success) {
              window.location.replace('/dashboard/user');
            }
          }).catch(() => {});
        }
      } catch (e) {}
    })();

    const form = document.getElementById('authForm');
    const input = document.getElementById('sessionInput');
    const btn = document.getElementById('continueBtn');
    const errorMsg = document.getElementById('errorMsg');
    const statusMsg = document.getElementById('statusMsg');

    input.addEventListener('input', () => {
      errorMsg.style.display = 'none';
      if (input.value.trim().length > 0) {
        btn.style.color = '#ffffff';
        btn.style.backgroundColor = '#262626';
      } else {
        btn.style.color = '#777777';
        btn.style.backgroundColor = '#1c1c1c';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      statusMsg.style.display = 'none';

      const token = input.value.trim();
      if (!token) {
        errorMsg.textContent = 'Please enter your session cookie.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/verify-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const data = await res.json();

        if (res.ok && data.success && data.user) {
          statusMsg.textContent = 'Success! Opening dashboard...';
          statusMsg.style.display = 'block';

          // Store session data locally
          try {
            localStorage.setItem('sotarium_registered_token', token);
            localStorage.setItem('sotarium_session_token', token);
            localStorage.setItem('sotarium_user_profile', JSON.stringify(data.user));
          } catch (e) {}

          // Redirect to user dashboard
          setTimeout(() => {
            window.location.href = '/dashboard/user';
          }, 400);
        } else {
          btn.disabled = false;
          btn.textContent = 'Continue';
          errorMsg.textContent = data.error || 'Invalid session cookie. Verification failed.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Continue';
        errorMsg.textContent = 'Unable to reach authentication service.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
