<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F1DAFD">
    
    <link rel="icon" href="/discord-logo.png" type="image/png">
    <title>Rollbux & Discord Automation Tools</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --app-bg: #0b0b0e;
            --panel-bg: #15151a;
            --sub-panel-bg: #101014;
            --snap-purple: #F1DAFD;
            --text-high: #f0f0f5;
            --text-mid: #a0a0aa;
            --text-low: #6a6a75;
            --border: rgba(255, 255, 255, 0.07);
            --transition: all 0.16s ease;
        }

        * {
            box-sizing: border-box;
            scrollbar-color: rgba(241, 218, 253, 0.65) rgba(255, 255, 255, 0.08);
            scrollbar-width: thin;
        }

        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        *::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.04);
        }
        *::-webkit-scrollbar-thumb {
            background: rgba(241, 218, 253, 0.55);
            border-radius: 999px;
            border: 2px solid rgba(15, 15, 18, 0.6);
        }
        *::-webkit-scrollbar-thumb:hover {
            background: rgba(241, 218, 253, 0.75);
        }

        body {
            margin: 0;
            background-color: var(--app-bg);
            color: var(--text-high);
            font-family: 'Fredoka', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Widescreen PC Viewport Wrapper */
        .viewport-wrapper {
            width: 100%;
            max-width: 1360px;
            padding: 0 28px;
            margin: 48px 0 80px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Centered Header Hero Download Section */
        .header-card {
            background: var(--panel-bg);
            padding: 44px 32px 40px;
            border-radius: 28px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            position: relative;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
        }

        /* Release Version Badge with Icon Stacked on Top */
        .version-badge {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px 20px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-high);
            font-size: 0.95rem;
            font-weight: 600;
            user-select: none;
            letter-spacing: 0.01em;
        }

        .version-badge i {
            color: var(--snap-purple);
            font-size: 1.05rem;
        }

        .download-avatar {
            width: 86px;
            height: 86px;
            border-radius: 22px;
            object-fit: cover;
            background: #101014;
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        }

        .header-card h1 {
            margin: 2px 0 0;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-high);
            letter-spacing: -0.02em;
        }

        .hero-actions {
            margin-top: 4px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.96rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn.primary {
            background: var(--snap-purple);
            color: #120d1c;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(241, 218, 253, 0.28);
        }

        .btn.primary:hover {
            box-shadow: 0 6px 28px rgba(241, 218, 253, 0.45);
        }

        /* Two-Column Side-by-Side (Across from Each Other) Section */
        .panels-across-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            align-items: stretch;
        }

        .card {
            background: var(--panel-bg);
            padding: 34px 32px 32px;
            border-radius: 24px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 240px;
        }

        /* Centered Header with Icon stacked on top of Title */
        .panel-header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            margin-bottom: 22px;
        }

        .panel-header-center .section-icon {
            font-size: 1.6rem;
            color: var(--snap-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(241, 218, 253, 0.08);
            border: 1px solid rgba(241, 218, 253, 0.18);
        }

        .panel-header-center h2 {
            margin: 0;
            font-size: 1.35rem;
            color: var(--text-high);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* Empty state placeholder styling ready for new content */
        .empty-content-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 140px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.015);
            color: var(--text-low);
            font-size: 0.92rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        /* Sub-cards inside each panel */
        .sub-cards-stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        .panel .sub-card {
            background: var(--sub-panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px 22px;
        }

        h3 {
            margin: 0 0 12px;
            color: var(--snap-purple);
            font-size: 1.05rem;
            font-weight: 600;
        }

        ul {
            margin: 0;
            padding-left: 20px;
            color: var(--text-mid);
        }

        li {
            margin-bottom: 8px;
            line-height: 1.5;
            font-size: 0.94rem;
        }

        li:last-child {
            margin-bottom: 0;
        }

        /* Responsive Mobile Styles */
        @media (max-width: 900px) {
            .viewport-wrapper {
                width: 100%;
                padding: 0 16px;
                margin: 24px 0 60px;
                gap: 16px;
            }

            .header-card {
                padding: 34px 20px 28px;
            }

            .header-card h1 {
                font-size: 1.7rem;
            }

            .hero-actions {
                width: 100%;
            }

            .hero-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .panels-across-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Viewport Content -->
    <div class="viewport-wrapper">

        <!-- Centered Download Hero Section -->
        <header class="header-card">
            <div class="version-badge">
                <i class="fa-solid fa-tag"></i>
                <span>Release v1.0.1</span>
            </div>
            <img src="/discord-logo.png" class="download-avatar" alt="DiscordViewer">
            <h1>Rollbux & Discord Automation Tools</h1>
            <div class="hero-actions">
                <a href="/download/file" download="DiscordViewer.exe" class="btn primary">
                    <i class="fa-solid fa-download"></i> Download Latest
                </a>
            </div>
        </header>

        <!-- Features & Changes Across from Each Other (Side-by-Side 50/50 Columns) -->
        <div class="panels-across-row">
            
            <!-- Features Section (Left Side - Cleared) -->
            <section class="card panel">
                <div class="panel-header-center">
                    <div class="section-icon">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <h2>Features</h2>
                </div>
                <div class="sub-cards-stack">
                    <div class="empty-content-box">
                        <span>No features listed yet</span>
                    </div>
                </div>
            </section>

            <!-- Changes Section (Right Side - Cleared) -->
            <section class="card panel">
                <div class="panel-header-center">
                    <div class="section-icon">
                        <i class="fa-solid fa-wrench"></i>
                    </div>
                    <h2>Changes</h2>
                </div>
                <div class="sub-cards-stack">
                    <div class="empty-content-box">
                        <span>No changes listed yet</span>
                    </div>
                </div>
            </section>

        </div>

    </div>

</body>
</html>
