<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download DiscordViewer</title>
  <link rel="icon" type="image/png" href="/sotarium-favicon.png?v=20261111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #fafafa;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #0d0d11;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle sleek dot grid on soft light background */
    .bg-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 60%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 60%, transparent 100%);
    }

    /* Ambient soft pastel glow */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 480px;
      background: radial-gradient(circle, rgba(241, 218, 253, 0.45) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      filter: blur(50px);
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 28px;
      padding: 38px 32px;
      box-shadow: 
        0 20px 48px -12px rgba(0, 0, 0, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .version-bubble {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      background: #f3f3f6;
      border: 1px solid #e5e5eb;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      color: #63636e;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.01em;
    }

    .app-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: #0d0d11;
      padding: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
    }
    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .text-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0d0d11;
    }

    .subtitle {
      font-size: 13px;
      color: #71717a;
      font-weight: 500;
      line-height: 1.4;
    }

    .download-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      background-color: #F1DAFD;
      color: #260f33;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      border-radius: 14px;
      cursor: pointer;
      border: 1px solid rgba(180, 120, 210, 0.3);
      box-shadow: 
        0 8px 22px rgba(241, 218, 253, 0.65),
        0 2px 4px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      outline: none;
    }
    .download-btn:hover {
      background-color: #f7e8fe;
      transform: translateY(-2px);
      box-shadow: 
        0 12px 28px rgba(241, 218, 253, 0.85),
        0 4px 8px rgba(0, 0, 0, 0.06);
    }
    .download-btn:active {
      transform: scale(0.985);
    }
    .download-btn svg {
      width: 19px;
      height: 19px;
      stroke-width: 2.3;
    }

    .btn-shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.45) 50%,
        transparent 100%
      );
      transition: left 0.6s ease;
      pointer-events: none;
    }
    .download-btn:hover .btn-shine {
      left: 100%;
    }

    .specs-pill {
      font-size: 11px;
      color: #8e8e99;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>
  <div class="bg-glow"></div>

  <div class="card">
    <div class="version-bubble">v1.0.0</div>

    <div class="app-icon">
      <img src="/discord-logo.png" alt="DiscordViewer">
    </div>

    <div class="text-group">
      <h1 class="title">DiscordViewer</h1>
      <p class="subtitle">Standalone Windows client with real-time multi-account monitoring</p>
    </div>

    <a href="/download/file" download="DiscordViewer.exe" class="download-btn">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      <span>Download</span>
      <div class="btn-shine"></div>
    </a>

    <span class="specs-pill">Windows 10 / 11 (64-bit) • 155 MB</span>
  </div>

</body>
</html>
