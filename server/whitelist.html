<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/sotarium-favicon.png?v=20261111" />
  <title>Whitelist Manager - Sotarium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #090a0d;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }
    .dv-field {
      background: #121215;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 14px;
      color: white;
      outline: none;
      transition: border-color 0.15s;
    }
    /* Hide HTML5 number spinner arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .dv-field:focus {
      border-color: rgba(255, 255, 255, 0.25);
    }
    .dv-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
    }
    .dv-pill.active {
      background: #ffffff;
      color: #000000;
    }
    .dv-pill.active:hover {
      background: #e6e6e6;
    }
    .dv-pill.inactive {
      background: #16161a;
      color: #8f8f8f;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .dv-pill.inactive:hover {
      background: #202026;
      color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 md:p-10">

  <!-- Header -->
  <div class="w-full max-w-4xl flex items-center justify-between pb-8 border-b border-white/5">
    <div class="flex items-center gap-3">
      <div class="size-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center overflow-hidden">
        <img src="/sotarium-favicon.png?v=20261111" alt="Sotarium" class="size-7 object-contain" />
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-tight">Upgrader Plan Whitelist</h1>
        <p class="text-xs text-zinc-400">Manage granted users and subscription duration</p>
      </div>
    </div>
    <a href="/" class="dv-pill inactive px-4 py-2 text-xs">Back to Dashboard</a>
  </div>

  <!-- Main Whitelist Box -->
  <div class="w-full max-w-4xl mt-8 flex flex-col gap-6">
    <!-- Controls Row -->
    <div class="flex flex-col sm:flex-row items-center gap-3 justify-between">
      <div class="relative w-full sm:w-80">
        <input type="text" id="searchInput" placeholder="Search Rollbux username..." oninput="filterUsers()" class="dv-field w-full text-xs pl-9" />
        <svg class="size-4 text-zinc-500 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button onclick="loadUsers()" type="button" class="dv-pill inactive px-4 py-2 text-xs">Refresh</button>
      </div>
    </div>

    <!-- Users Table Card -->
    <div class="w-full rounded-2xl bg-[#121215] border border-white/5 overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-[#18181c] text-zinc-400 font-semibold border-b border-white/5">
            <tr>
              <th class="p-4 pl-6">Rollbux Username</th>
              <th class="p-4">Plan Status</th>
              <th class="p-4">Expires In</th>
              <th class="p-4 pr-6 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody" class="divide-y divide-white/5 text-zinc-200">
            <tr>
              <td colspan="4" class="p-8 text-center text-zinc-500">Loading Rollbux accounts...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Activity-Style Overlay Modal for Whitelist Management -->
  <div id="manageUserModal" style="display: none;" class="fixed inset-0 z-[99999] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 select-none">
    <div class="w-full max-w-[420px] p-6 flex flex-col gap-4 shadow-2xl border border-white/10 bg-[#161616] rounded-[22px] animate-in fade-in zoom-in-95 duration-150">
      
      <!-- Top Header with Close -->
      <div class="flex items-center justify-between pb-1 border-b border-white/5">
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
            <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"></path>
            <path d="M5 21h14"></path>
          </svg>
          <span class="text-sm font-bold text-white">Upgrader Plan Access</span>
        </div>
        <button onclick="closeManageModal()" type="button" class="text-zinc-400 hover:text-white transition">
          <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Avatar & Selected Username -->
      <div class="flex flex-col items-center justify-center py-2 text-center">
        <div class="relative size-16 rounded-full overflow-hidden border border-white/15 shadow-lg mb-2.5 bg-[#232328] flex items-center justify-center">
          <img id="modalUserAvatar" src="https://cdn.rollbux.com/avatars/default-v1.png" class="size-full object-cover" alt="Avatar" />
        </div>
        <h4 id="modalUserName" class="text-lg font-bold text-white leading-tight">Username</h4>
        <span id="modalUserStatus" class="mt-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-zinc-800 text-zinc-400">Inactive</span>
      </div>

      <!-- Grant Time Form -->
      <div class="flex flex-col gap-3 p-4 rounded-[14px] bg-[#0c0c0c] border border-white/5">
        <span class="text-xs font-semibold text-zinc-400">Give Access for Duration:</span>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="grantAccess('1d')" class="dv-pill inactive py-2 text-xs">1 Day</button>
          <button type="button" onclick="grantAccess('7d')" class="dv-pill inactive py-2 text-xs">7 Days</button>
          <button type="button" onclick="grantAccess('30d')" class="dv-pill inactive py-2 text-xs">30 Days</button>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-1">
          <button type="button" onclick="grantAccess('lifetime')" class="dv-pill inactive py-2 text-xs">Lifetime</button>
          <button type="button" onclick="showCustomInput()" class="dv-pill inactive py-2 text-xs">Custom Days</button>
        </div>
        <div id="customDurationWrap" style="display:none;" class="flex items-center gap-2 mt-2">
          <input type="number" id="customDaysInput" placeholder="Days..." min="1" class="dv-field flex-1 text-xs" />
          <button type="button" onclick="grantAccessCustom()" class="dv-pill active px-4 py-2 text-xs">Grant</button>
        </div>
      </div>

      <!-- Revoke Button -->
      <div class="flex flex-col gap-2 pt-1">
        <button id="revokeAccessBtn" type="button" onclick="revokeAccess()" class="w-full py-3 rounded-xl bg-red-500/15 text-red-400 hover:bg-red-500/25 border border-red-500/30 font-bold text-xs transition cursor-pointer">
          Revoke Access
        </button>
        <button type="button" onclick="closeManageModal()" class="dv-pill inactive w-full py-2.5 text-xs font-semibold">
          Cancel
        </button>
      </div>

    </div>
  </div>

  <script>
    let allUsers = [];
    let activeUser = null;

    async function loadUsers() {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-zinc-500">Fetching users...</td></tr>';
      try {
        const res = await fetch('/api/whitelist/users');
        const data = await res.json();
        if (data.users) {
          allUsers = data.users;
          renderUsers(allUsers);
        } else {
          tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-400">Failed to load users</td></tr>';
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-400">Error: ' + e.message + '</td></tr>';
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersTableBody');
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-zinc-500">No users found.</td></tr>';
        return;
      }
      tbody.innerHTML = users.map((u, i) => {
        const isActive = u.has_access;
        const statusBadge = isActive
          ? '<span class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-[#54d487]/15 text-[#54d487] border border-[#54d487]/30">Active</span>'
          : '<span class="px-2.5 py-1 rounded-md text-[11px] font-semibold bg-zinc-800 text-zinc-400 border border-white/5">Locked</span>';
        
        let expText = '—';
        if (u.expires_at) {
          if (u.expires_at === 'lifetime') expText = 'Lifetime';
          else {
            const exp = new Date(u.expires_at);
            const diff = exp - new Date();
            if (diff <= 0) expText = 'Expired';
            else {
              const days = Math.floor(diff / (1000 * 60 * 60 * 24));
              const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
              expText = days > 0 ? `${days}d ${hours}h left` : `${hours}h left`;
            }
          }
        }

        return `
          <tr class="hover:bg-white/[0.02] transition">
            <td class="p-4 pl-6 font-semibold text-white flex items-center gap-3">
              <img src="${u.avatar_url || 'https://cdn.rollbux.com/avatars/default-v1.png'}" class="size-7 rounded-full object-cover bg-zinc-800" onerror="this.src='https://cdn.rollbux.com/avatars/default-v1.png'" />
              <span>${escapeHtml(u.username)}</span>
            </td>
            <td class="p-4">${statusBadge}</td>
            <td class="p-4 text-zinc-400">${expText}</td>
            <td class="p-4 pr-6 text-right">
              <button onclick="openManageModal(${i})" type="button" class="dv-pill active px-3.5 py-1.5 text-xs shadow-sm">
                Open
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterUsers() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const filtered = allUsers.filter(u => u.username.toLowerCase().includes(q));
      renderUsers(filtered);
    }

    window.openManageModal = function(index) {
      activeUser = allUsers[index];
      if (!activeUser) return;

      document.getElementById('modalUserName').textContent = activeUser.username;
      document.getElementById('modalUserAvatar').src = activeUser.avatar_url || 'https://cdn.rollbux.com/avatars/default-v1.png';
      
      const stEl = document.getElementById('modalUserStatus');
      if (activeUser.has_access) {
        stEl.textContent = 'Active Access (' + (activeUser.expires_at === 'lifetime' ? 'Lifetime' : activeUser.expires_at) + ')';
        stEl.className = 'mt-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#54d487]/15 text-[#54d487] border border-[#54d487]/30';
      } else {
        stEl.textContent = 'No Access';
        stEl.className = 'mt-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-zinc-800 text-zinc-400';
      }

      document.getElementById('customDurationWrap').style.display = 'none';
      document.getElementById('manageUserModal').style.display = 'flex';
    };

    window.closeManageModal = function() {
      document.getElementById('manageUserModal').style.display = 'none';
      activeUser = null;
    };

    window.showCustomInput = function() {
      const w = document.getElementById('customDurationWrap');
      w.style.display = w.style.display === 'none' ? 'flex' : 'none';
    };

    async function sendAccessUpdate(duration) {
      if (!activeUser) return;
      try {
        const res = await fetch('/api/whitelist/manage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: activeUser.username,
            action: duration === 'revoke' ? 'revoke' : 'grant',
            duration: duration
          })
        });
        const d = await res.json();
        if (d.success) {
          closeManageModal();
          loadUsers();
        } else {
          alert('Error: ' + (d.error || 'Failed'));
        }
      } catch (err) {
        alert('Request failed: ' + err.message);
      }
    }

    window.grantAccess = function(duration) {
      sendAccessUpdate(duration);
    };

    window.grantAccessCustom = function() {
      const val = parseInt(document.getElementById('customDaysInput').value, 10);
      if (!val || val <= 0) return alert('Enter valid number of days');
      sendAccessUpdate(val + 'd');
    };

    window.revokeAccess = function() {
      if (confirm(`Revoke access for ${activeUser.username}?`)) {
        sendAccessUpdate('revoke');
      }
    };

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
