<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Rollbux - My Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #242424;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #1c1c1c;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
    }
    .cue-input {
      width: 100%;
      height: 42px;
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 9999px;
      padding: 0 18px;
      font-size: 13px;
      color: #ffffff;
      text-align: center;
      outline: none !important;
      box-shadow: none !important;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }
    .cue-input:focus,
    .cue-input:focus-visible,
    .cue-input:active {
      outline: none !important;
      box-shadow: none !important;
      border-color: #383838 !important;
    }
    .cue-input::placeholder {
      color: #666666;
    }
    .cue-btn {
      width: 100%;
      height: 42px;
      background-color: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 9999px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease;
      outline: none;
    }
    .cue-btn:hover:not(:disabled) {
      background-color: #282828;
    }
    .cue-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Bets Element Gray Style */
    .bets-element {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 14px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .bets-element:hover {
      background: #232323;
      border-color: #333333;
    }
    .element-user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .user-avatar {
      position: relative;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      background: #2a2a2a;
    }
    .avatar-image {
      width: 100%;
      height: 100%;
    }
    .avatar-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  <style id="rollbux-discord-typography">
    /* Discord-style UI typography: compact, neutral, and readable across every page. */
    :root {
      --rollbux-ui-font: "gg sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    }
    html,
    body {
      font-family: var(--rollbux-ui-font) !important;
    }
    body,
    body *:not(.font-mono):not(code):not(pre) {
      font-family: var(--rollbux-ui-font) !important;
    }
    .font-mono,
    code,
    pre {
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace !important;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-start py-10 px-4">
  <main class="w-full max-w-[620px] flex flex-col gap-6">
    <!-- Top Bar -->
    <header class="flex items-center justify-between pb-2">
      <div>
        <a href="/" class="text-[20px] font-extrabold tracking-tight text-white hover:text-gray-300 transition">
          Rollbux
        </a>
        <h1 class="text-[17px] font-bold text-gray-300 mt-1">My Accounts</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="openAddAccountBtn" type="button" class="px-4 py-2 rounded-full bg-[#1e1e1e] hover:bg-[#282828] border border-white/10 text-xs font-semibold text-white transition active:scale-95 cursor-pointer">
          Add Account
        </button>
        <a href="/" class="px-3 py-2 rounded-full border border-white/5 bg-transparent hover:bg-white/5 text-xs text-gray-400 hover:text-white transition">
          Dashboard
        </a>
      </div>
    </header>

    <!-- Connected Accounts Card -->
    <section class="card p-5">
      <div class="flex items-center justify-between border-b border-white/5 pb-3 mb-4">
        <h2 class="text-sm font-semibold text-gray-200">Connected Accounts</h2>
        <span id="accountCountBadge" class="text-xs text-gray-500 font-mono">0 accounts</span>
      </div>

      <div id="connectedAccounts" class="flex flex-col gap-2">
        <div class="py-8 text-center text-xs text-gray-500">Loading accounts...</div>
      </div>
    </section>
  </main>

  <!-- Add Account Overlay (Cue Style Centered Rounded Card) -->
  <div id="accountModalOverlay" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 transition-all">
    <div class="w-full max-w-[340px] rounded-[24px] bg-[#242424] border border-white/10 p-7 shadow-2xl flex flex-col items-center text-center">
      <!-- Title -->
      <h3 class="text-[16px] font-bold text-white mb-5">Add Account</h3>

      <!-- Form with ONLY Session Cookie input (name and avatar are auto-fetched) -->
      <form id="addAccountForm" class="w-full flex flex-col gap-3">
        <input 
          type="password" 
          id="modalAccountToken" 
          placeholder="Enter Session Cookie" 
          required 
          autocomplete="off"
          class="cue-input"
        />

        <div id="modalErrorMsg" class="hidden text-[11px] text-red-400 py-1"></div>

        <button type="submit" id="submitModalBtn" class="cue-btn mt-1">
          Continue
        </button>

        <button type="button" id="cancelModalBtn" class="text-xs text-gray-500 hover:text-gray-300 mt-2 transition">
          Cancel
        </button>
      </form>
    </div>
  </div>

  <script>
    const connectedAccounts = document.getElementById('connectedAccounts');
    const accountCountBadge = document.getElementById('accountCountBadge');
    const modalOverlay = document.getElementById('accountModalOverlay');
    const openAddBtn = document.getElementById('openAddAccountBtn');
    const cancelAddBtn = document.getElementById('cancelModalBtn');
    const addForm = document.getElementById('addAccountForm');
    const tokenInput = document.getElementById('modalAccountToken');
    const errorMsg = document.getElementById('modalErrorMsg');
    const submitBtn = document.getElementById('submitModalBtn');

    function openModal() {
      tokenInput.value = '';
      errorMsg.classList.add('hidden');
      errorMsg.textContent = '';
      modalOverlay.classList.remove('hidden');
      tokenInput.focus();
    }

    function closeModal() {
      modalOverlay.classList.add('hidden');
    }

    openAddBtn.addEventListener('click', openModal);
    cancelAddBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    function getStoredToken() {
      try { return localStorage.getItem('sotarium_session_token') || localStorage.getItem('sotarium_registered_token') || ''; }
      catch(e) { return ''; }
    }
    function authHeaders() {
      const t = getStoredToken();
      const h = { 'Content-Type': 'application/json' };
      if (t) h['x-rollbux-token'] = t;
      return h;
    }

    async function loadConnectedAccounts() {
      try {
        const response = await fetch('/api/account/accounts', { credentials: 'include', headers: authHeaders() });
        if (response.status === 401) {
          window.location.href = '/?next=' + encodeURIComponent(window.location.pathname);
          return;
        }
        if (!response.ok) throw new Error('Unable to load accounts');
        const data = await response.json();
        const accounts = data.accounts || [];
        accountCountBadge.textContent = `${accounts.length} account${accounts.length === 1 ? '' : 's'}`;

        if (!accounts.length) {
          connectedAccounts.innerHTML = `
            <div class="py-8 text-center text-xs text-gray-500">
              No accounts connected yet. Click "Add Account" to connect one.
            </div>
          `;
          return;
        }

        connectedAccounts.innerHTML = accounts.map(account => {
          const avatarSrc = account.avatar_url || 'https://rollbux.com/icons/avatar.png';
          return `
            <div data-v-322fcb82="" class="bets-element bet-negative" bis_skin_checked="1">
              <div data-v-322fcb82="" class="element-user user-null" bis_skin_checked="1">
                <div data-v-322fcb82="" class="user-avatar avatar-clickable" bis_skin_checked="1">
                  <div data-v-7359c309="" data-v-322fcb82="" class="avatar-image" bis_skin_checked="1">
                    <img data-v-7359c309="" src="${avatarSrc}" alt="avatar" onerror="this.src='https://cdn.rollbux.com/avatars/default-v1.png'">
                  </div>
                </div>
                <span data-v-322fcb82="" class="user-name">${account.name || 'Account'}</span>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-xs font-mono font-bold text-[#acff46] bg-[#acff46]/10 border border-[#acff46]/20 px-2 py-0.5 rounded-md">
                  ${Number(account.balance ?? 0).toFixed(2)} BUX
                </span>
                <button type="button" data-account-id="${account.id}" class="remove-account text-xs text-red-400 hover:text-red-300 font-semibold cursor-pointer transition">
                  Remove
                </button>
              </div>
            </div>
          `;
        }).join('');

        document.querySelectorAll('.remove-account').forEach(button => {
          button.addEventListener('click', async () => {
            button.disabled = true;
            button.textContent = 'Removing...';
            try {
              await fetch('/api/account/accounts', {
                method: 'DELETE',
                credentials: 'include',
                headers: authHeaders(),
                body: JSON.stringify({ id: button.dataset.accountId })
              });
            } catch (e) {}
            loadConnectedAccounts();
          });
        });
      } catch (error) {
        connectedAccounts.innerHTML = `<div class="py-6 text-center text-xs text-red-400">${error.message}</div>`;
      }
    }

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = tokenInput.value.trim();
      if (!token) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Fetching user...';
      errorMsg.classList.add('hidden');

      try {
        const response = await fetch('/api/account/accounts', {
          method: 'POST',
          credentials: 'include',
          headers: authHeaders(),
          body: JSON.stringify({ token })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          errorMsg.textContent = data.error || 'Unable to add account';
          errorMsg.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Continue';
          return;
        }

        closeModal();
        loadConnectedAccounts();
      } catch (err) {
        errorMsg.textContent = err.message || 'Network error';
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Continue';
      }
    });

    loadConnectedAccounts();
  </script>
</body>
</html>
